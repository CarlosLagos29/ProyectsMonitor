services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-monitor}
      POSTGRES_USER: ${DB_USER:-monitor}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-monitor}
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  back:
    build: ./back
    env_file:
      - path: ./back/.env
        required: false
        format: raw
    environment:
      SPRING_PROFILES_ACTIVE: docker
      PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-monitor}
      DB_USER: ${DB_USER:-monitor}
      DB_PASSWORD: ${DB_PASSWORD:-monitor}
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  front:
    build:
      context: ./front
      target: dev
    ports:
      - "3000:3000"
    volumes:
      - ./front:/app
      - /app/node_modules

  front-prod:
    profiles: ["prod"]
    build:
      context: ./front
      target: prod
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    ports:
      - "3000:8080"

volumes:
  pgdata:

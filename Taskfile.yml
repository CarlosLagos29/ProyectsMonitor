version: '3'

tasks:
  start:
    desc: Build the images if needed, start Postgres, back and front (front in dev mode with hot reload), and show their status (no logs; use logs or logs:<service>)
    cmds:
      - docker compose --profile prod rm --stop --force front-prod
      - docker compose up --build -d --renew-anon-volumes
      - docker compose ps

  start:*:
    desc: Build if needed and start one service (back, front or postgres) and follow its logs. The front runs in dev mode with hot reload
    vars:
      SERVICE: '{{index .MATCH 0}}'
    cmds:
      - docker compose --profile prod rm --stop --force front-prod
      - docker compose up --build -d --renew-anon-volumes {{.SERVICE}}
      - docker compose logs -f {{.SERVICE}}

  restart:
    desc: Stop everything, rebuild the images if needed, start again and show their status (no logs)
    cmds:
      - docker compose --profile prod down
      - docker compose up --build -d --renew-anon-volumes
      - docker compose ps

  restart:*:
    desc: Rebuild if needed and recreate one service (back, front or postgres) without touching the others, then follow its logs
    vars:
      SERVICE: '{{index .MATCH 0}}'
    cmds:
      - docker compose up --build -d --force-recreate --renew-anon-volumes --no-deps {{.SERVICE}}
      - docker compose logs -f {{.SERVICE}}

  logs:
    desc: Follow the logs of all services
    cmds:
      - docker compose logs -f

  logs:*:
    desc: Follow the logs of one service (back, front or postgres)
    vars:
      SERVICE: '{{index .MATCH 0}}'
    cmds:
      - docker compose logs -f {{.SERVICE}}

  stop:
    desc: Stop and remove the containers (keeps the images and the database volume)
    cmds:
      - docker compose --profile prod down

  stop:*:
    desc: Stop and remove one service (back, front or postgres), keeping its image and the database volume
    vars:
      SERVICE: '{{index .MATCH 0}}'
    cmds:
      - docker compose rm --stop --force {{.SERVICE}}

  delete:
    desc: Remove everything this project created in Docker (containers, network, database volume and built images)
    cmds:
      - docker compose --profile prod down --rmi local --volumes --remove-orphans

  build:front:
    desc: Build the production front (Vite build served by nginx, like the deploy) and serve it on port 3000 instead of the dev server, then follow its logs
    cmds:
      - docker compose rm --stop --force front
      - docker compose --profile prod up --build -d front-prod
      - docker compose logs -f front-prod

  lint:
    desc: Run the linters of back and front
    cmds:
      - task: lint:back
      - task: lint:front

  lint:back:
    desc: Run ktlint on the back (needs JDK 17+ in JAVA_HOME)
    dir: back
    cmds:
      - ./gradlew ktlintCheck

  lint:front:
    desc: Run ESLint and the Prettier check on the front
    dir: front
    cmds:
      - npm run lint
      - npm run format:check

  format:
    desc: Format back (ktlint) and front (Prettier)
    cmds:
      - task: format:back
      - task: format:front

  format:back:
    desc: Fix the back formatting with ktlint (needs JDK 17+ in JAVA_HOME)
    dir: back
    cmds:
      - ./gradlew ktlintFormat

  format:front:
    desc: Fix the front formatting with Prettier
    dir: front
    cmds:
      - npm run format

server:
  port: ${PORT:8080}
  forward-headers-strategy: native
  tomcat:
    remoteip:
      remote-ip-header: CF-Connecting-IP

spring:
  application:
    name: projectsmonitor
  profiles:
    default: local
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /docs

app:
  api-token: ${API_TOKEN:}
  jwt:
    secret: ${JWT_SECRET:}
    admin-ttl: 1h
    guest-ttl: 12h
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  limits:
    check-interval: 10m
    manual-check-cooldown: 1m
    guest:
      max-active: 10
      manual-checks:
        capacity: 10
        period: 1h
      requests:
        capacity: 60
        period: 1m
  auth-rate-limit:
    guest-token:
      capacity: 10
      period: 1h
  check:
    timeouts:
      connect: 2s
      read: 2s
      total: 10s
    max-redirects: 5
    allowed-ports: [80, 443]
    per-host:
      capacity: 10
      period: 1m

logging:
  level:
    root: WARN
    dev.projectsmonitor: INFO
    org.springframework.boot.tomcat.TomcatWebServer: INFO

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:monitor}
    username: ${DB_USER:monitor}
    password: ${DB_PASSWORD:monitor}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

logging:
  level:
    dev.projectsmonitor: DEBUG

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME}
